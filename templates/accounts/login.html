{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="auth-card p-4 p-md-5">
            <div class="mb-4">
                <p class="text-warning fw-bold mb-2">Welcome back</p>
                <h1 class="fw-bold">Login</h1>
                <p class="text-secondary mb-0">Manage your restaurant menu or save your favorite dishes.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit"
                        class="btn btn-warning w-100 rounded-pill py-2 mt-3 fw-bold">
                    Login
                </button>
            </form>

            <p class="text-secondary small mt-4 mb-0">
                New to MenuFlow?
                <a href="{% url 'register' %}"
                   class="text-warning text-decoration-none fw-bold">Create an account</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
