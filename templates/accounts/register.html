{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="auth-card p-4 p-md-5">
            <div class="mb-4">
                <p class="text-warning fw-bold mb-2">Start your account</p>
                <h1 class="fw-bold">Register</h1>
                <p class="text-secondary mb-0">Create a customer account or register as a restaurant owner.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit"
                        class="btn btn-warning w-100 rounded-pill py-2 mt-3 fw-bold">
                    Create Account
                </button>
            </form>

            <p class="text-secondary small mt-4 mb-0">
                Already have an account?
                <a href="{% url 'login' %}"
                   class="text-warning text-decoration-none fw-bold">Login</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
