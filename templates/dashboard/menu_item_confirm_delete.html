{% extends 'dashboard/base_dashboard.html' %}

{% block dashboard_content %}

<div class="dashboard-card p-4 p-md-5">
    <p class="text-danger fw-bold mb-2">Delete Menu Item</p>
    <h1 class="fw-bold">{{ item.title }}</h1>
    <p class="text-warning mb-1">{{ item.restaurant.name }} / {{ item.category.name }}</p>
    <p class="text-secondary">This action cannot be undone.</p>

    <form method="POST"
          class="d-flex gap-2 flex-wrap">
        {% csrf_token %}
        <button type="submit"
                class="btn btn-danger rounded-pill px-4 fw-bold">Delete</button>
        <a href="{% url 'dashboard_menu_items' %}"
           class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
    </form>
</div>

{% endblock %}
